services:
  moltbot-gateway:
    container_name: moltbot
    image: ${CLAWDBOT_IMAGE:-moltbot:local}
    build: .
    environment:
      HOME: /home/node
      MOLTBOT_STATE_DIR: /var/lib/moltbot
      TERM: xterm-256color
      CLAWDBOT_GATEWAY_TOKEN: ${CLAWDBOT_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      VOICE_AGENT_API_URL: http://voice-backend:8000
      CLAWDBOT_GATEWAY_PASSWORD: ${CLAWDBOT_GATEWAY_PASSWORD}
    volumes:
      - moltbot_data:/var/lib/moltbot
      - moltbot_workspace:/home/node/clawd
    ports:
      - "127.0.0.1:${CLAWDBOT_GATEWAY_PORT:-18789}:18789"
      - "127.0.0.1:${CLAWDBOT_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    depends_on:
      - voice-backend
    command:
      [
        "node",
        "/app/moltbot.mjs",
        "gateway",
        "--bind",
        "${CLAWDBOT_GATEWAY_BIND:-lan}",
        "--port",
        "${CLAWDBOT_GATEWAY_PORT:-18789}",
        "--allow-unconfigured"
      ]

  voice-backend:
    image: trevisanricardo/ai-voice-backend:latest
    container_name: voice-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.voice
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LANGUAGE=${LANGUAGE:-pt}
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  moltbot_data:
  moltbot_workspace:
